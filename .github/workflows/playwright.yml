name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
      DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://dummy:dummy@localhost:5432/dummy' }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-test-secret-at-least-32-characters-long' }}
      NEXTAUTH_URL: "http://localhost:3000"
      ALLOWED_ORIGINS: "http://localhost:3000"
      NODE_ENV: test
      CI: "true"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Generate Prisma client
      run: npm run db:generate
    - name: Production build (E2E always targets `npm run start`, never dev)
      run: npm run build
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright smoke (read-only, no business writes)
      run: npx playwright test --project=chromium
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
